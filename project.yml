name: Whiteboard
options:
  bundleIdPrefix: uk.co.zacgarby
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    DEVELOPMENT_TEAM: ZX7M3HPXGX   # Zac Garby (paid developer account since Oct 2026)
    CODE_SIGN_STYLE: Automatic
packages:
  OpenCV:
    url: https://github.com/yeatse/opencv-spm
    exactVersion: 4.13.0          # 5.x reorganises features2d; stay on 4.x until ported
targets:
  Whiteboard:
    type: application
    platform: iOS
    sources: [Sources/Whiteboard]
    dependencies:
      - package: OpenCV
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Whiteboard/Whiteboard-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.zacgarby.whiteboard-scan
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only for now (runs on iPad in compatibility mode)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"  # scripts/testflight.sh overrides this with a timestamp per upload
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Whiteboard/Info.plist
      properties:
        CFBundleDisplayName: Whiteboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "Whiteboard takes photos of the board as you move your phone along it."
        NSPhotoLibraryAddUsageDescription: "Whiteboard saves the flattened board to your photo library."
        NSPhotoLibraryUsageDescription: "Whiteboard saves flattened boards into a \"Whiteboards\" album in your photo library."
        ITSAppUsesNonExemptEncryption: false      # no encryption beyond the OS's: skips the export-compliance question
        UIFileSharingEnabled: true                # scans (Documents/Captures) visible in Files / Finder
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark                # the app is dark-only (Darkroom design)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  WhiteboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/WhiteboardTests
      - path: fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Whiteboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Whiteboard:
    build: { targets: { Whiteboard: all, WhiteboardTests: [test] } }
    test:  { targets: [WhiteboardTests] }
